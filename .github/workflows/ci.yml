name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest, SQLite + PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oz
          POSTGRES_PASSWORD: oz
          POSTGRES_DB: operation_zero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oz -d operation_zero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OZ_ENV: test
      OZ_DATABASE_URL: postgresql+psycopg://oz:oz@localhost:5432/operation_zero
      OZ_REDIS_URL: redis://localhost:6379/0
      OZ_REQUIRE_REDIS_TESTS: "1"
      OZ_REPORTS_DIR: ./data/reports
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Verify PostgreSQL migrations
        run: alembic upgrade head

      - name: Verify Redis connectivity
        run: python -c "import os, redis; assert redis.from_url(os.environ['OZ_REDIS_URL']).ping()"

      - name: Create PostgreSQL test database
        run: |
          python - <<'PY'
          import psycopg

          conn = psycopg.connect("host=localhost port=5432 user=oz password=oz dbname=postgres")
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("DROP DATABASE IF EXISTS operation_zero_test")
              cur.execute("CREATE DATABASE operation_zero_test")
          conn.close()
          PY

      - name: Run tests (SQLite)
        run: python -m pytest

      - name: Run tests (PostgreSQL)
        env:
          OZ_TEST_DATABASE_URL: postgresql+psycopg://oz:oz@localhost:5432/operation_zero_test
        run: python -m pytest

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

  security:
    name: Security scans (gitleaks, pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: pip-audit (fails on known vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The dependency upgrade removed all known findings. Fail on high or
      # critical so a regression cannot slip through unnoticed.
      - name: npm audit (fails on high or critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    name: Docker build + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: operation-zero-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: operation-zero-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Keep every severity visible in the Security tab. This step never fails
      # the job; the blocking gate below uses only the CRITICAL/HIGH subset.
      - name: Trivy SARIF report ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # Blocking gate: fail on fixable CRITICAL/HIGH findings only.
      - name: Trivy gate ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
