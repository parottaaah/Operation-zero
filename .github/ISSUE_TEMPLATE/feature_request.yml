name: Feature request
description: Propose a product or engineering change for OPERATION ZERO.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the PRD first. If the request conflicts with an invariant or an
        open question in PRD section 12, say so explicitly.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Keep the smallest version that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Auth / RBAC / tenancy
        - Services / health checks
        - Logs / redaction
        - Alerts
        - Incidents / reports
        - Integrations / webhooks
        - AI investigation
        - Frontend
        - Workers
        - CI / tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and tenant-isolation impact
      description: Does this touch workspace scoping, RBAC, redaction, SSRF or external data flows?
    validations:
      required: true
