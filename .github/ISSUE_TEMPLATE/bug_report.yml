name: Bug report
description: Report a reproducible defect in OPERATION ZERO.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, tokens, customer data or personal data.
        Report security vulnerabilities privately via SECURITY.md, not here.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-baseline or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Auth / RBAC / tenancy
        - Services / health checks
        - Logs / redaction
        - Alerts
        - Incidents / reports
        - Integrations / webhooks
        - AI investigation
        - Frontend
        - Workers
        - CI / tooling
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, tokens and personal data before pasting.
      render: shell
    validations:
      required: false
